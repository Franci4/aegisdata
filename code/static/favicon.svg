<?xml version="1.0" encoding="UTF-8"?>
<!-- AegisData 品牌标识（矢量）
     结构：① 盾形主描边（右侧留开口）② 顶部飘带向右抽出尖角 ③ 内侧浅色呼应形成层次
     纯矢量，无位图、无背景，任意尺寸清晰。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="AegisData">
  <defs>
    <linearGradient id="adg" x1="6%" y1="2%" x2="94%" y2="98%">
      <stop offset="0%"   stop-color="#2b46a8"/>
      <stop offset="36%"  stop-color="#2f7ec6"/>
      <stop offset="70%"  stop-color="#3db6cd"/>
      <stop offset="100%" stop-color="#52dcbe"/>
    </linearGradient>
    <linearGradient id="adl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6ea6e6"/>
      <stop offset="100%" stop-color="#8cefdc"/>
    </linearGradient>
  </defs>

  <!-- 内侧浅色：盾形内缘 -->
  <path fill="none" stroke="url(#adl)" stroke-opacity=".5"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M52 78
           Q52 62 66 59
           Q82 56 96 66
           Q80 50 62 50
           Q44 50 42 78
           Q40 110 56 136
           Q72 162 100 178
           Q128 162 144 136
           Q160 110 158 78
           Q156 50 138 50
           Q124 50 112 58"/>
  <!-- 顶部浅色呼应 -->
  <path fill="none" stroke="url(#adl)" stroke-opacity=".45"
        stroke-width="4.5" stroke-linecap="round"
        d="M76 52 Q106 40 138 38 Q166 36 186 27"/>

  <!-- 顶部飘带：左端细、右端尖，向右上抽出 -->
  <path fill="none" stroke="url(#adg)" stroke-width="19" stroke-linecap="round"
        d="M62 52 Q96 40 128 38 Q160 36 188 24"/>

  <!-- 盾形主描边：右侧留开口 -->
  <path fill="none" stroke="url(#adg)"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"
        d="M34 80
           Q34 48 66 44
           Q94 40 112 58
           Q94 64 78 72
           Q64 78 52 78
           Q50 108 60 132
           Q76 160 100 180
           Q124 160 140 132
           Q150 108 148 78"/>
</svg>
